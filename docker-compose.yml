version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: nctu-erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nctu_erp
      MYSQL_USER: nctu_user
      MYSQL_PASSWORD: nctu_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/nctu_erp.sql:/docker-entrypoint-initdb.d/nctu_erp.sql
    networks:
      - nctu-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nctu-erp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nctu_erp
      DB_USER: nctu_user
      DB_PASSWORD: nctu_password
      DB_DIALECT: mysql
      JWT_SECRET: nctu_erp_jwt_secret_key_2024_secure_random_string
      JWT_EXPIRE: 24h
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nctu-network
    volumes:
      - ./server/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./client/frontend
      dockerfile: Dockerfile
    container_name: nctu-erp-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      VITE_APP_NAME: NCTU ERP System
      VITE_APP_VERSION: 1.0.0
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - nctu-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: nctu-erp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - nctu-network

volumes:
  mysql_data:
    driver: local

networks:
  nctu-network:
    driver: bridge