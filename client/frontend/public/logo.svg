<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0A500"/>
      <stop offset="50%" stop-color="#D98A00"/>
      <stop offset="100%" stop-color="#B87500"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050547"/>
      <stop offset="100%" stop-color="#0A0A6B"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="50%" stop-color="#A9A9A9"/>
      <stop offset="100%" stop-color="#787878"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Silver Frame Box -->
  <rect x="20" y="20" width="460" height="350" rx="16" fill="url(#navyGrad)" stroke="url(#silverGrad)" stroke-width="10" filter="url(#shadow)"/>
  
  <!-- Tech Circuit Board Pattern in Background -->
  <g stroke="#2D3DB5" stroke-width="3" fill="none" opacity="0.65">
    <path d="M 60 40 L 60 120 L 120 180 M 60 80 L 140 80 L 180 120 M 440 40 L 440 120 L 380 180 M 440 80 L 360 80 L 320 120"/>
    <path d="M 90 280 L 150 280 L 190 240 M 410 280 L 350 280 L 310 240 M 250 40 L 250 100"/>
    <circle cx="120" cy="180" r="5" fill="#D98A00"/>
    <circle cx="180" cy="120" r="5" fill="#D98A00"/>
    <circle cx="380" cy="180" r="5" fill="#D98A00"/>
    <circle cx="320" cy="120" r="5" fill="#D98A00"/>
    <circle cx="190" cy="240" r="5" fill="#D98A00"/>
    <circle cx="310" cy="240" r="5" fill="#D98A00"/>
    <circle cx="250" cy="100" r="5" fill="#D98A00"/>
  </g>

  <!-- Golden Triangular Emblem -->
  <polygon points="250,45 75,335 425,335" fill="url(#goldGrad)" stroke="#B87500" stroke-width="4"/>
  <polygon points="250,85 295,160 205,160" fill="#0A0A6B" opacity="0.9"/>

  <!-- NCT Text overlay -->
  <g filter="url(#shadow)">
    <text x="250" y="275" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="115" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" stroke="#050547" stroke-width="3">NCT</text>
  </g>

  <!-- University Name Below -->
  <text x="250" y="425" font-family="'Cairo', sans-serif" font-weight="800" font-size="28" fill="#0A0A6B" text-anchor="middle">جامعة القاهرة الجديدة التكنولوجية</text>
  <text x="250" y="460" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#D98A00" text-anchor="middle" letter-spacing="2">NEW CAIRO TECHNOLOGICAL UNIVERSITY</text>
</svg>
