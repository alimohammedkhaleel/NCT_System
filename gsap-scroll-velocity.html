<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Horizontal Scroll Velocity</title>
    <!-- استيراد GSAP و ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <!-- استيراد الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        /* إزالة الهوامش الأساسية وخلفية الصفحة الافتراضية يمكن أن تكون سوداء للرؤية، ولكن الأقسام شفافة */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Tajawal', sans-serif;
            background-color: #0a0110; /* خلفية عامة للصفحة لإظهار النصوص البيضاء */
            color: white;
            overflow-x: hidden;
        }

        /* 
         * الأقسام الثلاثة الرئيسية 
         * لا يوجد خلفيات كما طلبت (شفافة)
         */
        .section-vertical {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent; /* خلفية شفافة */
        }

        .scroll-indicator {
            font-size: 2rem;
            opacity: 0.5;
            text-align: center;
        }

        /* حاوية القسم الأفقي */
        .horizontal-section {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: transparent; /* خلفية شفافة */
        }

        /* الحاوية التي ستتحرك أفقياً */
        .horizontal-wrapper {
            display: flex;
            width: fit-content;
            height: 100%;
            background: transparent; /* خلفية شفافة */
        }

        /* اللوحات الفردية */
        .panel {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent; /* خلفية شفافة */
        }

        .panel h1 {
            font-size: clamp(4rem, 15vw, 12rem);
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* تنسيقات مختلفة للنصوص للتميز */
        .panel:nth-child(1) h1 {
            color: transparent;
            -webkit-text-stroke: 2px #fff;
        }

        .panel:nth-child(2) h1 {
            background: linear-gradient(135deg, #b388ff, #7a5af8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .panel:nth-child(3) h1 {
            color: #fff;
        }

        .panel:nth-child(4) h1 {
            color: transparent;
            -webkit-text-stroke: 2px #b388ff;
        }

        .panel:nth-child(5) h1 {
            color: #7a5af8;
            text-shadow: 0 0 40px rgba(122, 90, 248, 0.8);
        }
    </style>
</head>
<body>

    <!-- 1. القسم الرأسي الأول -->
    <section class="section-vertical">
        <div class="scroll-indicator">
            قم بالتمرير للأسفل لبدء التأثير<br>
            ↓
        </div>
    </section>

    <!-- 2. القسم الأوسط (التأثير الأفقي) -->
    <section class="horizontal-section" id="horizontal-container">
        <div class="horizontal-wrapper" id="horizontal-wrapper">
            <div class="panel"><h1>Welcome to NCT</h1></div>
            <div class="panel"><h1>إبداع</h1></div>
            <div class="panel"><h1>تطور</h1></div>
            <div class="panel"><h1>سرعة</h1></div>
            <div class="panel"><h1>GSAP</h1></div>
        </div>
    </section>

    <!-- 3. القسم الرأسي الثالث (العودة للطبيعي) -->
    <section class="section-vertical">
        <div class="scroll-indicator">
            عدنا للتمرير الرأسي الطبيعي<br>
            ↑
        </div>
    </section>

    <script>
        // تسجيل الإضافة
        gsap.registerPlugin(ScrollTrigger);

        const container = document.getElementById("horizontal-container");
        const wrapper = document.getElementById("horizontal-wrapper");
        const panels = gsap.utils.toArray(".panel");

        // الحصول على العرض الكلي للحركة
        function getScrollAmount() {
            return wrapper.offsetWidth - window.innerWidth;
        }

        // الحركة الأساسية (التثبيت + التمرير الأفقي)
        const tween = gsap.to(panels, {
            xPercent: -100 * (panels.length - 1),
            ease: "none",
            scrollTrigger: {
                trigger: container,
                pin: true,
                scrub: 1, // حركة سلسة Scrubbing
                snap: 1 / (panels.length - 1), // التوقف عند كل لوحة
                end: () => "+=" + getScrollAmount()
            }
        });

        // تأثير Velocity الإبداعي (التسارع، الدوران، الشفافية)
        panels.forEach((panel, i) => {
            const text = panel.querySelector('h1');
            
            gsap.timeline({
                scrollTrigger: {
                    trigger: container,
                    // مزامنة توقيت حركة كل لوحة بناءً على موقعها
                    start: () => `top top-=${i * window.innerWidth}`,
                    end: () => `top top-=${(i + 1) * window.innerWidth}`,
                    scrub: 1, // التزامن مع سرعة تمرير المستخدم
                }
            })
            // الدخول
            .fromTo(text, 
                { opacity: 0.2, scale: 0.8, rotate: i % 2 === 0 ? 10 : -10 },
                { opacity: 1, scale: 1, rotate: 0, duration: 0.5, ease: "power3.inOut" }
            )
            // الخروج
            .to(text, 
                { opacity: 0.2, scale: 0.8, rotate: i % 2 === 0 ? -10 : 10, duration: 0.5, ease: "power3.inOut" }
            );
        });
    </script>
</body>
</html>
